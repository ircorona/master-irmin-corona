# Código de clase (gzip y caché), tal cual. Solo cambian el puerto y el root.
# El bloque de Brotli no está: este nginx no trae el módulo y no arrancaría
# (prueba.py lo comprueba aparte con nginx -t).
server {
    listen 8041;
    server_name clase.test;
    root "__SITIO__";

    gzip on;
    gzip_types      text/plain application/xml;
    gzip_proxied    no-cache no-store private expired auth;
    gzip_min_length 1000;
gzip_comp_level 5;
gzip_vary on;

    location ~* \.(css|js)$ {
        expires 8M;
    }
    location ~* \.woff2?$ {
        expires 1y;
    }
     location ~* \.(xml)$ {
        expires 20m;
    }
}
