# Ejercicio clase 15 (Servidores avanzado): WPO en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.
server {
    listen 8042;
    server_name mi-web.test;
    root "__SITIO__";
    index index.html;

    # Compresión al vuelo: todo el texto, no solo text/plain y XML
    gzip on;
    gzip_comp_level 5;          # 1-9; por encima de 5-6 gana muy poco y cuesta CPU en cada petición
    gzip_min_length 1000;       # por debajo de ~1 kB, la cabecera gzip no compensa
    gzip_vary on;               # Vary: Accept-Encoding para CDN y proxies
    gzip_proxied any;           # comprimir también si la petición llega por un proxy (cabecera Via)
    # nginx sirve .xml como text/xml (Apache, como application/xml): van los dos
    gzip_types text/plain text/css text/javascript application/javascript application/json
               text/xml application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # Precomprimidos: si existe estilo.css.gz, se sirve tal cual. Comprimido
    # una vez a nivel 9, sin gastar CPU en cada petición (prueba.py los genera).
    gzip_static on;

    # Ficheros abiertos en caché: menos llamadas al disco en cada petición
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;

    # Caché de usuario: activos un año (con ?v= al cambiarlos), XML 20 minutos,
    # HTML revalidado siempre (clase 09)
    location ~* \.(css|js|woff2?|jpe?g|png|webp|avif|svg)$ {
        # Una sola cabecera: expires + add_header Cache-Control darían dos
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.xml$ {
        expires 20m;
    }
    location / {
        expires epoch;           # Cache-Control: no-cache -> el navegador revalida (304)
        try_files $uri $uri/ =404;
    }
}
