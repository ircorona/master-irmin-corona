# El código de clase con UN solo cambio: gzip_types incluye CSS y XML.
# Sirve para ver qué hace gzip_proxied cuando el fichero tiene caché.
server {
    listen 8043;
    server_name clase-tipos.test;
    root "__SITIO__";

    gzip on;
    gzip_types      text/plain application/xml text/css text/xml;
    gzip_proxied    no-cache no-store private expired auth;
    gzip_min_length 1000;
gzip_comp_level 5;
gzip_vary on;

    location ~* \.(css|js)$ {
        expires 8M;
    }
    location ~* \.woff2?$ {
        expires 1y;
    }
     location ~* \.(xml)$ {
        expires 20m;
    }
}
