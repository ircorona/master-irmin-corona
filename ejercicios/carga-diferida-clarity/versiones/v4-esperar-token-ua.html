<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>v4 · Esperar 5 segundos + token + user-agent</title>
<!-- Código de clase: «ESPERAR 5 SEGUNDOS + TOKEN + USER-AGENT» -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
    // Verifica el User-Agent para excluir Google/Bing bots
    var userAgent = navigator.userAgent;
    if (/Google|Yandex/i.test(userAgent)) {
        console.warn('Microsoft Clarity tracking is disabled for Google/Yandex bots.');
       return;}
    // Verifica si el script ya se ejecutó antes usando localStorage
    var clarityScriptLoaded = localStorage.getItem('clarityScriptLoaded');
    var delay = clarityScriptLoaded ? 0 : 5000;
    setTimeout(function() {
        // Crear y configurar el elemento script
        var script = document.createElement('script');
        script.type = 'text/javascript';
//RECUERDA: Lo que está en script.text es el texto del script, puedes probarlo con cualquiera
        script.text = `
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "TU-ID");
        `;
        document.head.appendChild(script);
        // Establece una bandera en localStorage para indicar que el script ya se cargó
        if (!clarityScriptLoaded) {
            localStorage.setItem('clarityScriptLoaded', 'true');
        }
    }, delay);
});
</script>
</head>
<body>
<h1>v4 · Esperar 5 segundos + token + user-agent</h1>
</body>
</html>
