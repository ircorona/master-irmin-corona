# Código de clase, tal cual, en un server con WordPress (try_files a index.php).
# El bloque de /sobre-mi/ se deja como en clase: todo comentado.
server {
    listen 8041;
    server_name clase.test;
    root "__SITIO__";
    index index.php index.html;

    add_header X-Asdrubal "Pagina con el SEO revisado por Asdrubal SEO SL";

    location = /wp-content/themes/sanchezdonate/images/sobre-mi/sobre-carlos.png {
           add_header X-Robots-Tag "noindex";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;

        if ($request_uri ~ ^/sobre-mi/?$) {
           #  add_header X-Robots-Tag "noindex";
            # Para configurar el header canonical
            # add_header Link '<https://carlos.sanchezdonate.com>; rel="canonical"';
            # Para configurar los headers hreflang
            # add_header Link '<https://carlos.sanchezdonate.com>; rel="alternate" hreflang="es", <https://carlos.sanchezdonate.com/en>; rel="alternate" hreflang="en"';
        }
        if ($request_uri ~ ^/servicios-seo/?$) {
            add_header X-Robots-Tag "noindex";
        }
    }
}
