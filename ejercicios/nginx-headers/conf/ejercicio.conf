# Ejercicio clase 18 (Servidores avanzado): cabeceras HTTP personalizadas en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon, con un
# WordPress mínimo detrás (php-cgi).
#
# Tres cabeceras:
#   X-Mensaje     un mensajito en toda la web
#   X-Robots-Tag  noindex en /servicios-seo/ y en la foto de sobre-mi
#   Link          canonical del PDF hacia su página HTML
#
# Sin if y sin add_header dentro de las location: cada map decide el valor
# según la URL pedida y todas las add_header viven en el server. Una
# add_header con valor vacío no se envía, así que fuera de esas URLs no
# sale nada. Y como ninguna location tiene add_header propias, ninguna
# pierde las del server (en nginx se sustituyen, no se suman).
#
# $request_uri es la URL que pidió el navegador, con parámetros. Por eso
# (\?|$): /servicios-seo/?utm_source=x también lleva su noindex. Y es la
# original aunque WordPress la haya pasado a /index.php por dentro ($uri no).
map $request_uri $x_robots {
    default "";
    "~^/servicios-seo/?(\?|$)" "noindex";
    "~^/wp-content/themes/sanchezdonate/images/sobre-mi/sobre-carlos\.png(\?|$)" "noindex";
}

map $request_uri $link_canonical {
    default "";
    "~^/descargas/guia-seo\.pdf(\?|$)" '<https://mi-web.test/guia-seo/>; rel="canonical"';
}

server {
    listen 8042;
    server_name mi-web.test;
    root "__SITIO__";
    index index.php index.html;

    add_header X-Mensaje "SEO revisado por Irmin Corona";
    add_header X-Robots-Tag $x_robots;
    add_header Link $link_canonical;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}
