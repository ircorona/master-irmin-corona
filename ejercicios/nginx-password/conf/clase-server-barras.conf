# El mismo bloque de clase con UN cambio: barras / en la ruta.
server {
    listen 8032;
    server_name clase-barras.test;
    root "__SITIO__";
    index index.php index.html;

    auth_basic           "Administrator's Area";
    auth_basic_user_file "__PASS__";

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }

    location ~ /\.ht {
        deny all;
    }
}
