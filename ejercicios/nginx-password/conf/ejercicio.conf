# Ejercicio clase 16 (Servidores avanzado): proteger /privado/ con contraseña
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.
server {
    listen 8034;
    server_name mi-web.test;
    root "__SITIO__";
    index index.php index.html;

    # Ficheros ocultos (.htpasswd, .env, .git): 404 en toda la web
    location ~ /\. {
        return 404;
    }

    # ^~ : si la URL empieza por /privado/, esta location gana a cualquier
    # regex del server, también a la de PHP. El PHP de dentro va anidado,
    # así hereda la contraseña.
    location ^~ /privado/ {
        auth_basic "Zona privada";
        # Fuera de la carpeta de la web y con barras /, entre comillas
        auth_basic_user_file "__PASS_FUERA__";

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REMOTE_USER $remote_user;   # PHP sabe quién ha entrado
            fastcgi_pass php_upstream;
        }
    }
    location = /privado {
        return 301 /privado/;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}
