# La versión del artículo de Carlos: proteger solo una carpeta con
# location /ruta { auth_basic ...; }, en un server que sirve PHP.
# Sin el "location ~ /\.ht" de Laragon.
server {
    listen 8033;
    server_name clase-location.test;
    root "__SITIO__";
    index index.php index.html;

    location /privado {
        auth_basic "Acceso restringido";
        auth_basic_user_file "__PASS__";
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}
