# Código de clase, tal cual: auth_basic en el server (toda la web), con la
# ruta de Windows y barras invertidas. __PASS_WIN__ lo pone prueba.py:
# la ruta real de sitio/pass/.htpasswd escrita con \ como en clase.
server {
    listen 8031;
    server_name clase.test;
    root "__SITIO__";
    index index.php index.html;

    auth_basic           "Administrator's Area";
    auth_basic_user_file __PASS_WIN__;

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }

    # Lo que trae el server de Laragon (clase 13)
    location ~ /\.ht {
        deny all;
    }
}
