# La trampa de add_header: una cabecera puesta en el server desaparece en
# cualquier location que tenga su propio add_header.
server {
    listen 8063;
    server_name demo.test;
    root "__SITIO__";

    add_header X-Content-Type-Options "nosniff" always;

    location ~* \.pdf$ {
        add_header X-Robots-Tag "noindex" always;
    }
}
