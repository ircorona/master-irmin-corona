# Ejercicio clase 13 (Servidores avanzado): el server de clase corregido, más
# lo de las clases 06 a 12 traducido de .htaccess a nginx.
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.
# Puertos de prueba: 8062 (http) y 8462 (https). En producción, 80 y 443.

# Clase 06: http -> https con 301. Un server aparte, solo para redirigir.
server {
    listen 8062;
    server_name mi-web.test;
    return 301 https://$host:8462$request_uri;   # en producción: https://$host$request_uri
}

server {
    listen 8462 ssl;
    http2 on;
    server_name mi-web.test;
    root "__SITIO__";
    index index.php index.html;
    charset utf-8;

    ssl_certificate     "C:/laragon/etc/ssl/laragon.crt";
    ssl_certificate_key "C:/laragon/etc/ssl/laragon.key";
    # Sin ssl_protocols ni ssl_ciphers: los valores por defecto de nginx
    # (TLSv1.2 TLSv1.3, HIGH:!aNULL:!MD5) son mejores que los de la foto.

    # Va en cada location que tenga su propio add_header (ver demo-add-header.conf)
    add_header X-Content-Type-Options "nosniff" always;

    # Clase 09: compresión (nginx no trae Brotli de serie: gzip)
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;

    # Clase 08: bloqueo por user-agent ("return" dentro de "if" es el uso seguro de if)
    if ($http_user_agent ~* "(SemrushBot|Screaming Frog SEO Spider|ChatGPT-User)") {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;      # sin autoindex y con 404 de verdad
    }

    location ^~ /.well-known/ { }       # security.txt, acme-challenge: públicos

    # Ficheros ocultos: .htaccess, .env, .git... (la foto solo cubría .ht*)
    location ~ /\. {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }

    # Clase 10: indirección. "internal" hace que /ejemplo/ solo exista por
    # dentro: pedida desde fuera da 404, sin trucos con THE_REQUEST.
    # En nginx gana la primera regex que casa: esta va antes que las de .txt,
    # .pdf e imágenes (si no, una .jpg de la indirección caería en la otra) y
    # después de la de ficheros ocultos (si no, /indireccion/asdrubal/.env se
    # serviría desde /ejemplo/.env).
    location = /indireccion/asdrubal {
        return 301 /indireccion/asdrubal/;
    }
    location ~ ^/indireccion/asdrubal/(.*)$ {
        set $resto $1;
        # Subcarpeta sin barra: 301 a la URL pública con barra (si no, la
        # misma página saldría con y sin barra)
        if (-d $document_root/ejemplo/$resto) {
            rewrite [^/]$ $uri/ permanent;
        }
        rewrite ^ /ejemplo/$resto last;
    }
    location ^~ /ejemplo/ {
        internal;
        try_files $uri $uri/index.html =404;   # sin la redirección de barra que enseñaría /ejemplo/
    }

    # Clase 12: forzar descarga de los .txt, salvo los públicos.
    # En nginx gana la primera regex que casa: el orden aquí sí importa.
    location ~* ^/(robots|llms|ads|sitemap)\.txt$ { }
    location ~* \.txt$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Clase 07: X-Robots-Tag en los PDF
    location ~* \.pdf$ {
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Clases 09 y 11: imágenes con caché de un año y protección de hotlinking
    location ~* \.(jpe?g|png|gif|webp|avif)$ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        # Google Imágenes: 204 (opt-out documentado por Google)
        if ($http_referer ~* "^https?://([^/]+\.)?google\.(com|[a-z]{2,3}|com?\.[a-z]{2})(/|:|$)") {
            return 204;
        }
        # Resto: vacío ("none"), la propia web y otros buscadores pasan
        valid_referers none blocked server_names ~\.bing\.com ~duckduckgo\.com;
        if ($invalid_referer) {
            return 403;
        }
    }

    # Clase 09: caché de usuario de CSS y JS
    location ~* \.(css|js|woff2?)$ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
