# Código de clase, tal cual, dentro de un server.
#
# Andamio de la prueba (no es de clase): todas las peticiones salen de
# 127.0.0.1, así que prueba.py manda la IP que quiere simular en la cabecera
# X-Real-IP y nginx la toma como IP del visitante (módulo realip). Es lo mismo
# que se hace detrás de Cloudflare o de un proxy.
server {
    listen 8001;
    server_name clase.test;
    root "__SITIO__";
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    allow all;
    deny 216.24.213.200;
    deny 216.24.213.230;
    deny 216.24.213.250;
    deny 216.24.213.206;
}
