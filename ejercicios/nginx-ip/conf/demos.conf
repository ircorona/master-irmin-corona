# Demos de lo que sale mal. Cada server es un error distinto.

# 1. Herencia: una location con su propio deny pierde los del server.
#    Se quería bloquear una IP más en /privado/ y se abrió la puerta a las
#    cuatro del server.
server {
    listen 8003;
    server_name herencia.test;
    root "__SITIO__";
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    deny 216.24.213.200;
    deny 216.24.213.230;
    deny 216.24.213.250;
    deny 216.24.213.206;

    location /privado/ {
        deny 198.51.100.7;
    }
}

# 2. Detrás de un proxy sin realip: nginx ve la IP del proxy (aquí
#    127.0.0.1) y la cabecera con la IP del visitante no cuenta.
server {
    listen 8004;
    server_name sin-realip.test;
    root "__SITIO__";
    index index.html;

    deny 216.24.213.200;
    deny 216.24.213.230;
    deny 216.24.213.250;
    deny 216.24.213.206;
}

# 3. Muchas IP: geo en lugar de una lista de deny. El bloque geo va en
#    http {}, fuera del server; usa la IP ya corregida por realip.
geo $ip_bloqueada {
    default 0;
    216.24.213.200 1;
    216.24.213.230 1;
    216.24.213.250 1;
    216.24.213.206 1;
}

server {
    listen 8005;
    server_name geo.test;
    root "__SITIO__";
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    if ($ip_bloqueada) {
        return 403;
    }
}
