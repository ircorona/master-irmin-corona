# Ejercicio clase 19 (Servidores avanzado): bloqueo por IP en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.
#
# nginx lee allow/deny de arriba abajo y se queda con la PRIMERA que casa.
# Por eso los deny van primero. "allow all" al final sobra (si ninguna regla
# casa, nginx deja pasar), pero deja claro que el resto entra.
#
# Andamio de la prueba, como en clase.conf: X-Real-IP desde 127.0.0.1.
server {
    listen 8002;
    server_name mi-web.test;
    root "__SITIO__";
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    deny 216.24.213.200;
    deny 216.24.213.230;
    deny 216.24.213.250;
    deny 216.24.213.206;
    allow all;

    # /privado/: solo la oficina. deny all cierra al resto, también a las
    # cuatro IP de arriba (esta location tiene sus propias reglas y no
    # hereda las del server, así que tiene que cerrar ella).
    location /privado/ {
        allow 203.0.113.10;
        deny all;
    }
}
