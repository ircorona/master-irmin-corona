# Ejercicio clase 20 (Servidores avanzado): una indirección en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.
#
# /indireccion/asdrubal/... enseña el contenido de /ejemplo/... sin
# redirigir: la barra de direcciones no cambia. Y /ejemplo/ pedida
# directamente da 404, para que no haya dos URLs con lo mismo.
server {
    listen 8007;
    server_name mi-web.test;
    root "__SITIO__";
    index index.html;

    # Sin barra final: 301 a la URL pública con barra
    location = /indireccion/asdrubal {
        return 301 /indireccion/asdrubal/;
    }

    location ~ ^/indireccion/asdrubal/(?<resto>.*)$ {
        # Una carpeta pedida sin barra: 301 a la URL PÚBLICA con barra.
        # Si no, nginx añade la barra él solo y redirige a /ejemplo/sub/,
        # enseñando la URL interna.
        if (-d $document_root/ejemplo/$resto) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        # La indirección: last vuelve a buscar location con la URL nueva
        rewrite ^ /ejemplo/$resto last;
    }

    # La URL interna: internal = solo para peticiones internas (las que
    # vienen de un rewrite). Pedida desde fuera, 404.
    location ^~ /ejemplo/ {
        internal;
    }
    location = /ejemplo {
        return 404;
    }
}
