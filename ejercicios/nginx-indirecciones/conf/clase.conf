# Código de clase, tal cual, en un sitio estático + PHP (sin WordPress).
# Las versiones de WordPress están en wp/nginx-*.conf.

# 8006: indirección básica + la de proyecto PHP con permanent
server {
    listen 8006;
    server_name clase.test;
    root "__SITIO__";
    index index.php index.html;

    #Indirecciones 1 Esta no genera redireccion o 404
    location ~ ^/articulo-seo/(.*)$ {
        rewrite ^/articulo-seo/(.*)$ /articulo/$1 last;
    }

    location ~ ^/wpo.php$ {
        rewrite ^/wpo.php$ /sobre-mi.php permanent;
        #rewrite ^/wpo.php$ /sobre-mi.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}

# 8010: la de proyecto PHP con la línea comentada activada (last)
server {
    listen 8010;
    server_name clase-last.test;
    root "__SITIO__";
    index index.php index.html;

    location ~ ^/wpo.php$ {
        #rewrite ^/wpo.php$ /sobre-mi.php permanent;
        rewrite ^/wpo.php$ /sobre-mi.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}
