# El server de WordPress. prueba.py pone en el hueco de reglas las de cada
# escenario y recarga nginx.
server {
    listen 8008;
    server_name wp.test;
    root "__WP__";
    index index.php;

__REGLAS__

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_upstream;
    }
}
