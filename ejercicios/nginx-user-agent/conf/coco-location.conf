# Otra forma del opcional: el if dentro de la location de esa URL.
# location = es exacta: con y sin barra, dos entradas.
server {
    listen 8013;
    server_name coco.test;
    root "__SITIO__";
    index index.html;

    location ~ ^/sobre-mi/?$ {
        if ($http_user_agent ~* "screaming frog seo spider") {
            return 403;
        }
        try_files $uri $uri/ =404;
    }
}
