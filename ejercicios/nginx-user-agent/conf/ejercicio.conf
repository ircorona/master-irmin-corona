# Ejercicio clase 17 (Servidores avanzado): bloqueos por user-agent en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.

# 1. Yandex fuera de toda la web. Todos sus robots llevan "Yandex" en el
#    user-agent (YandexBot, YandexImages, YandexMobileBot...).
# 2. Opcional: Screaming Frog fuera solo de /sobre-mi/.
# Un map por regla: se calcula una vez, fuera del server, y el server solo
# pregunta por la variable. Las regex van entre comillas.
# El robots.txt se deja leer: así Yandex ve su "Disallow: /" y deja de
# intentarlo. Las regex de un map se prueban en orden y gana la primera.
map "$http_user_agent|$uri" $bloquear_ua {
    default 0;
    "~*yandex.*\|/robots\.txt$" 0;
    "~*yandex" 1;
}

map "$http_user_agent|$uri" $bloquear_ua_url {
    default 0;
    "~*screaming frog seo spider.*\|/sobre-mi(/|$)" 1;
}

server {
    listen 8012;
    server_name mi-web.test;
    root "__SITIO__";
    index index.html;

    if ($bloquear_ua) {
        return 403;
    }
    if ($bloquear_ua_url) {
        return 403;
    }
}
