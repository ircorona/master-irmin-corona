# Código de clase: las dos líneas de rewrite, tal cual
# Solo cambian el puerto y el root (__SITIO__ lo pone prueba.py).
server {
    listen 8051;
    server_name sanchezdonate.test;
    root "__SITIO__";
    index index.php index.html;
    include comun/php.inc;

rewrite ^/curiosidades/(.*)$ https://sanchezdonate.test/ permanent;
rewrite ^(/curiosidades/)(.*)$ https://carlos.sanchezdonate.com/datos-curiosos/$2 permanent;
}
