# Ejercicio clase 14 (Servidores avanzado): redirecciones y códigos forzados en nginx
# Probado con python prueba.py en el nginx 1.27.3 de Laragon.

# Quitar el .php de las URLs: solo GET y HEAD (un formulario que hace POST a
# /enviar.php no puede recibir un 301, que lo convertiría en GET y perdería
# los datos). Se calcula con $request_uri, la URL original, que no cambia con
# las reescrituras internas: no hay bucle. Se conservan los parámetros.
map "$request_method $request_uri" $sin_php {
    default "";
    "~^(GET|HEAD) /(?<ruta>(?:[^?]*/)?)index\.php(?<qs>\?.*)?$"  "/$ruta$qs";
    "~^(GET|HEAD) /(?<ruta>[^?]*)\.php(?<qs>\?.*)?$"              "/$ruta$qs";
}

server {
    listen 8056;
    server_name mi-web.test;
    root "__SITIO__";
    index index.php index.html;

    if ($sin_php) {
        return 301 $sin_php;
    }

    location / {
        # /contacto sirve contacto.php sin enseñar la extensión
        try_files $uri $uri/ @sin-extension;
    }
    location @sin-extension {
        rewrite ^(.*)$ $1.php last;
    }

    include comun/php.inc;

    # 1. Página -> página (301). Relativa: nginx la completa con el dominio
    #    de la petición, así que sobrevive a una migración de dominio.
    location = /curiosidades/ {
        return 301 /datos-curiosos/;
    }

    # 2. Directorio -> directorio conservando la estructura. rewrite conserva
    #    los parámetros (?utm=...) solo; return no.
    location ^~ /curiosidades/ {
        rewrite ^/curiosidades/(.*)$ /datos-curiosos/$1 permanent;
    }

    # 3. Redirección temporal (302): la URL vuelve a estar disponible
    location = /rebajas/ {
        return 302 /datos-curiosos/;
    }

    # 4. A otro dominio (migración): absoluta, conservando ruta y parámetros
    location ^~ /viejo-blog/ {
        rewrite ^/viejo-blog/(.*)$ https://otro-dominio.test/blog/$1 permanent;
    }

    # 5. Códigos forzados
    location = /contacto-antiguo/ {
        return 410;                       # retirado para siempre
    }
    location = /mantenimiento/ {
        add_header Retry-After 3600 always;
        return 503;                       # temporal: vuelve en una hora
    }
}
