# Código de clase: «Si todo va al index», tal cual
# Solo cambian el puerto y el root (__SITIO__ lo pone prueba.py).
server {
    listen 8054;
    server_name sanchezdonate.test;
    root "__SITIO__";
    index index.php index.html;
    include comun/php.inc;

location / {
# Redireccionar /foo/bar a /foo/bar.php si existe
try_files $uri $uri.php$is_args$args;
# Si el URI original termina en .php, retornar 404
if ($request_uri ~ "\.php$") {
return 404;
}
}
}
