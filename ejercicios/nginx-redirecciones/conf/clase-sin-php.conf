# Código de clase: «Convertir de .php a no .php», tal cual
# Solo cambian el puerto y el root (__SITIO__ lo pone prueba.py).
server {
    listen 8055;
    server_name sanchezdonate.test;
    root "__SITIO__";
    index index.php index.html;
    include comun/php.inc;

location / {
#cuidado de no duplicar el location
try_files $uri $uri/ @extensionless-php;
index index.html index.htm index.php;
}
location @extensionless-php {
rewrite ^(.*)$ $1.php last;
}
if ($request_uri ~ ^/(.*)\.php) {
return 301 /$1;
}
}
