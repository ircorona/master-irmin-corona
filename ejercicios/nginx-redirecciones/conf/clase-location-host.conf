# Código de clase: la variante «recomendada por escalabilidad», tal cual
# Solo cambian el puerto y el root (__SITIO__ lo pone prueba.py).
server {
    listen 8053;
    server_name sanchezdonate.test;
    root "__SITIO__";
    index index.php index.html;
    include comun/php.inc;

# Redirección de una página individual a otra página del mismo hosting. Se Recomienda esta Redirección por escalabilidad si en un futuro se hace una migración a otra URL:
location = /curiosidades/{
return 301 $scheme://$host//datos-curiosos/;
}
}
