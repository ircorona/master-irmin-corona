# Código de clase: página -> página con return, y el 503, tal cual
# Solo cambian el puerto y el root (__SITIO__ lo pone prueba.py).
server {
    listen 8052;
    server_name sanchezdonate.test;
    root "__SITIO__";
    index index.php index.html;
    include comun/php.inc;

# Redirección de una página individual a otra página
location = /curiosidades/{
return 301 https://example.com/datos-curiosos/;
}
location = /contacto/{
return 503;
}
}
